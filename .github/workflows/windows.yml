name: windows

# cmd 분기와 셸 스위트. 둘 다 실패하면 PR을 막는다. continue-on-error는 다시 붙이지 않는다.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  cmd-launcher:
    name: run-hook.cmd 인자 전달 (cmd.exe)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: cmd.exe 분기 회귀 테스트
        shell: cmd
        run: tests\hooks\test-run-hook-cmd.cmd

  bash-suite:
    name: 셸 스위트 (Git Bash)
    runs-on: windows-latest
    # 타임아웃이 없으면 입력을 기다리는 스위트가 로그 없이 멈춘다.
    steps:
      - uses: actions/checkout@v4
      - name: bash 존재 확인
        shell: bash
        run: bash --version && python3 --version
      # tests/run.sh로 돌리면 이 러너에서 멈춘다. 스위트마다 stdin을 닫고 상한을 둔다.
      - name: 스위트별 (개별 상한 · stdin 닫음)
        shell: bash
        timeout-minutes: 10
        run: |
          rc_all=0
          for t in tests/scripts/test-*.sh tests/hooks/test-*.sh tests/skills/test-*.sh tests/install/test-*.sh tests/install/smoke.sh; do
            printf '=== START %s\n' "$t"
            # 출력은 파일로 받는다. 파이프를 잡으면 timeout 뒤에도 tail이 멈춘다.
            # `|| rc=$?`가 없으면 Actions bash -e가 첫 실패에서 루프를 죽인다.
            # 상한 300초. install이 느려 더 짧으면 정상 스위트가 잘린다.
            rc=0
            timeout -k 10 300 bash "$t" </dev/null >"$RUNNER_TEMP/out.txt" 2>&1 || rc=$?
            # 통과는 마지막 3줄, 실패는 전문. 꼬리만 보면 첫 실패가 잘린다.
            if [ "$rc" = 0 ]; then tail -3 "$RUNNER_TEMP/out.txt" || true
            else cat "$RUNNER_TEMP/out.txt" || true; fi
            printf '=== END %s rc=%s%s\n' "$t" "$rc" "$([ "$rc" = 124 ] && printf ' (TIMEOUT — 매달림)')"
            [ "$rc" = 0 ] || rc_all=1
          done
          exit "$rc_all"
      - name: 전체 스위트 (run.sh 경유 — 매달림 관측용)
        continue-on-error: true
        shell: bash
        timeout-minutes: 8
        run: bash tests/run.sh
